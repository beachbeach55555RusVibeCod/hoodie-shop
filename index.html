<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoodieShop — магазин толстовок</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; color:#1a1a1a; }
    header { padding:20px 40px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; }
    .logo { font-weight:800; font-size:24px; }
    .hero { text-align:center; padding:120px 20px; background:#f5f5f5; }
    .hero h1 { font-size:48px; margin-bottom:20px; }
    .hero p { font-size:20px; color:#555; margin-bottom:30px; }
    .btn { display:inline-block; padding:14px 32px; background:#1a1a1a; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px; padding:60px 40px; max-width:1100px; margin:0 auto; }
    .card { border:1px solid #eee; border-radius:12px; overflow:hidden; }
    .card .ph { height:220px; background:#ddd; }
    .card .info { padding:16px; }
    footer { text-align:center; padding:40px; color:#888; border-top:1px solid #eee; }
  </style>
</head>
<body>
  <header>
    <div class="logo">HoodieShop</div>
    <a class="btn" href="#catalog">Каталог</a>
  </header>
  <section class="hero">
    <h1>Толстовки, в которых тепло</h1>
    <p>Качественные худи и свитшоты. Доставка по всей России.</p>
    <a class="btn" href="#catalog">Смотреть каталог</a>
  </section>
  <section class="products" id="catalog">
    <div class="card"><div class="ph"></div><div class="info"><h3>Худи Classic</h3><p>2 990 руб.</p></div></div>
    <div class="card"><div class="ph"></div><div class="info"><h3>Свитшот Oversize</h3><p>3 490 руб.</p></div></div>
    <div class="card"><div class="ph"></div><div class="info"><h3>Худи Zip</h3><p>3 990 руб.</p></div></div>
  </section>
  <footer>&copy; 2026 HoodieShop</footer>
</body>
</html>
